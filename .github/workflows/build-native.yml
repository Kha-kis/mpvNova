name: build-native

on:
  workflow_dispatch:
    inputs:
      fel_renderer:
        description: Experimental FEL base-layer buffer path
        required: true
        default: p010
        type: choice
        options:
          - p010
          - yuv8
      el_decoder:
        description: Experimental FEL enhancement-layer decoder
        required: true
        default: software
        type: choice
        options:
          - software
          - hardware-copy
      fel_cpu_target:
        description: Experimental 32-bit FFmpeg CPU target for the onn. V2
        required: true
        default: generic
        type: choice
        options:
          - generic
          - cortex-a55
      fel_profile_symbols:
        description: Preserve FFmpeg symbols for isolated performance profiling
        required: true
        default: false
        type: boolean
      fel_hevc10_neon_probe:
        description: Experimental 10-bit HEVC integer-pixel weighted NEON routines
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [armv7l]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Fix script permissions
        run: chmod +x buildscripts/include/*.sh buildscripts/scripts/*.sh buildscripts/buildall.sh

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson

      - name: Download SDK + NDK
        run: |
          cd buildscripts
          IN_CI=1 ./include/download-sdk.sh

      - name: Download deps
        env:
          MPV_FEL_YUV8_PROBE: ${{ inputs.fel_renderer == 'yuv8' && '1' || '0' }}
          MPV_FEL_EL_HWCOPY_PROBE: ${{ inputs.el_decoder == 'hardware-copy' && '1' || '0' }}
          MPV_FEL_HEVC10_NEON_PROBE: ${{ inputs.fel_hevc10_neon_probe && '1' || '0' }}
        run: |
          cd buildscripts
          ./include/download-deps.sh

      - name: Build native libraries (${{ matrix.arch }})
        env:
          MPV_FEL_A55_PROBE: ${{ inputs.fel_cpu_target == 'cortex-a55' && '1' || '0' }}
          MPV_FEL_PROFILE_SYMBOLS: ${{ inputs.fel_profile_symbols && '1' || '0' }}
        run: |
          cd buildscripts
          ./buildall.sh --arch ${{ matrix.arch }} --only-deps mpvnova

      - name: Build ARM HEVC checkasm probe
        if: inputs.fel_hevc10_neon_probe
        run: |
          TOOLCHAIN_BIN=$(realpath $(echo buildscripts/sdk/android-ndk-*/toolchains/llvm/prebuilt/*/bin))
          test -x "$TOOLCHAIN_BIN/llvm-ar"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          make -C buildscripts/deps/ffmpeg/_build_${{ matrix.arch }} -j2 \
            AR="$TOOLCHAIN_BIN/llvm-ar" RANLIB="$TOOLCHAIN_BIN/llvm-ranlib" checkasm

      - name: Upload ARM HEVC checkasm probe
        if: inputs.fel_hevc10_neon_probe
        uses: actions/upload-artifact@v7
        with:
          name: hevc-checkasm-${{ matrix.arch }}
          if-no-files-found: error
          path: buildscripts/deps/ffmpeg/_build_${{ matrix.arch }}/tests/checkasm/checkasm

      - name: Build libplayer.so (${{ matrix.arch }})
        run: |
          NDK_DIR=$(echo buildscripts/sdk/android-ndk-*)
          export PATH="$NDK_DIR:$PATH"

          arch=${{ matrix.arch }}
          prefix="$PWD/buildscripts/prefix"
          if [ "$arch" = "armv7l" ]; then
            ndk-build -C app/src/main -j$(nproc) \
              PREFIX32="$prefix/armv7l" \
              APP_ABI=armeabi-v7a
          elif [ "$arch" = "arm64" ]; then
            ndk-build -C app/src/main -j$(nproc) \
              PREFIX64="$prefix/arm64" \
              APP_ABI=arm64-v8a
          elif [ "$arch" = "x86" ]; then
            ndk-build -C app/src/main -j$(nproc) \
              PREFIX_X86="$prefix/x86" \
              APP_ABI=x86
          elif [ "$arch" = "x86_64" ]; then
            ndk-build -C app/src/main -j$(nproc) \
              PREFIX_X64="$prefix/x86_64" \
              APP_ABI=x86_64
          fi

      - name: Verify subtitle assembly (${{ matrix.arch }})
        run: |
          arch=${{ matrix.arch }}
          expected=1
          if [ "$arch" = "armv7l" ]; then expected=0; fi
          grep -qx "#define CONFIG_ASM $expected" "buildscripts/deps/libass/_build_$arch/config.h"
          echo "libass assembly: $expected ($arch)"

      - name: Verify native configuration and patches (${{ matrix.arch }})
        env:
          MPV_FEL_YUV8_PROBE: ${{ inputs.fel_renderer == 'yuv8' && '1' || '0' }}
          MPV_FEL_EL_HWCOPY_PROBE: ${{ inputs.el_decoder == 'hardware-copy' && '1' || '0' }}
          MPV_FEL_A55_PROBE: ${{ inputs.fel_cpu_target == 'cortex-a55' && '1' || '0' }}
          MPV_FEL_HEVC10_NEON_PROBE: ${{ inputs.fel_hevc10_neon_probe && '1' || '0' }}
        run: |
          if [ "$MPV_FEL_A55_PROBE" = 1 ]; then
            grep -q -- '-mcpu=cortex-a55' "buildscripts/deps/ffmpeg/_build_${{ matrix.arch }}/ffbuild/config.mak"
          fi
          grep -qx '#define HAVE_LIBCURL 1' "buildscripts/deps/mpv/_build_${{ matrix.arch }}/config.h"
          git -C buildscripts/deps/ffmpeg apply --reverse ../../patches/ffmpeg-mediacodec-explicit-dv.patch
          git -C buildscripts/deps/ffmpeg apply --reverse ../../patches/ffmpeg-mediacodec-empty-hevc-extradata.patch
          if [ "$MPV_FEL_HEVC10_NEON_PROBE" = 1 ]; then
            git -C buildscripts/deps/ffmpeg apply --reverse ../../patches/ffmpeg-hevc10-weighted-neon-probe.patch
          fi
          git -C buildscripts/deps/ffmpeg diff --exit-code
          if [ "$MPV_FEL_EL_HWCOPY_PROBE" = 1 ]; then
            git -C buildscripts/deps/mpv apply --reverse ../../patches/mpv-dovi-el-hwcopy-probe.patch
          fi
          git -C buildscripts/deps/mpv apply --reverse ../../patches/mpv-dovi-fel-toggle.patch
          git -C buildscripts/deps/mpv apply --reverse ../../patches/mpv-external-subtitle-url.patch
          renderer_patch=mpv-aimagereader-p010-probe
          if [ "$MPV_FEL_YUV8_PROBE" = 1 ]; then renderer_patch=mpv-aimagereader-yuv8-probe; fi
          git -C buildscripts/deps/mpv apply --reverse "../../patches/${renderer_patch}.patch"
          git -C buildscripts/deps/mpv diff --exit-code
          test -z "$(git -C buildscripts/deps/mpv status --porcelain --untracked-files=no)"

      - name: Collect .so files
        env:
          MPV_FEL_PROFILE_SYMBOLS: ${{ inputs.fel_profile_symbols && '1' || '0' }}
        run: |
          arch=${{ matrix.arch }}
          mkdir -p collected

          if [ "$arch" = "armv7l" ]; then abi="armeabi-v7a"
          elif [ "$arch" = "arm64" ]; then abi="arm64-v8a"
          elif [ "$arch" = "x86" ]; then abi="x86"
          elif [ "$arch" = "x86_64" ]; then abi="x86_64"
          fi

          cp buildscripts/prefix/$arch/lib/*.so collected/
          cp app/src/main/libs/$abi/*.so collected/
          if [ "$MPV_FEL_PROFILE_SYMBOLS" = 1 ]; then
            cp "buildscripts/deps/ffmpeg/_build_$arch/libavcodec/libavcodec.so" collected/libavcodec.so
            readelf -S collected/libavcodec.so | grep -q '\.symtab'
          fi
          for lib in libplayer libmpv libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale libc++_shared; do
            test -s "collected/$lib.so"
          done

      - name: Verify 16 KB ELF and RELRO alignment (${{ matrix.arch }})
        if: matrix.arch == 'arm64' || matrix.arch == 'x86_64'
        run: |
          NDK_DIR=$(echo buildscripts/sdk/android-ndk-*)
          readelf="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for lib in collected/*.so; do
            headers=$("$readelf" -lW "$lib")
            while read -r align; do
              if (( align < 16384 )); then
                echo "Invalid 16 KB load alignment: $lib ($align)" >&2
                exit 1
              fi
            done < <(printf '%s\n' "$headers" | awk '$1 == "LOAD" { print $NF }')
            while read -r address size; do
              if (( (address + size) % 16384 != 0 )); then
                echo "Invalid 16 KB RELRO alignment: $lib" >&2
                exit 1
              fi
            done < <(printf '%s\n' "$headers" | awk '$1 == "GNU_RELRO" { print $3, $6 }')
            echo "16 KB ELF and RELRO alignment verified: $lib"
          done

      - name: Upload .so files
        uses: actions/upload-artifact@v7
        with:
          name: native-libs-${{ matrix.arch }}
          if-no-files-found: error
          path: collected/*.so

  bundle:
    if: false # This experimental branch only packages arm64 for the onn. test.
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: all-libs

      - name: Organize by ABI
        run: |
          mkdir -p jniLibs/armeabi-v7a jniLibs/arm64-v8a jniLibs/x86 jniLibs/x86_64
          cp all-libs/native-libs-armv7l/*.so jniLibs/armeabi-v7a/
          cp all-libs/native-libs-arm64/*.so jniLibs/arm64-v8a/
          cp all-libs/native-libs-x86/*.so jniLibs/x86/
          cp all-libs/native-libs-x86_64/*.so jniLibs/x86_64/

      - name: Upload combined jniLibs
        uses: actions/upload-artifact@v7
        with:
          name: jniLibs-all-abis
          path: jniLibs/
